<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cópia histórica do site do COEE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f2f5f7;
      color: #23313b;
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      background: white;
      border-top: 5px solid #245b78;
      box-shadow: 0 8px 30px #23313b1a;
    }
    h1 { margin: 0 0 1rem; color: #17425a; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.2; }
    p { margin: 0 0 1.5rem; }
    a { color: #245b78; }
    .button {
      display: inline-block;
      padding: .7rem 1.2rem;
      background: #245b78;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }
    .button:hover, .button:focus-visible { background: #17425a; }
  </style>
</head>
<body>
  <main>
    <h1>Cópia histórica do site do COEE</h1>
    <p>
      Cópia histórica do site do Colegiado de Engenharia Elétrica da UFOP (COEE),
      baseada em capturas do Internet Archive.
      <a href="https://web.archive.org/web/20240727095454/https://coee.ufop.br/">Consultar captura de referência</a>.
    </p>
    <a class="button" href="paginas/inicio.html">Acessar cópia histórica</a>
  </main>
</body>
</html>
